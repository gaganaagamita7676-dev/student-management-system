
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | UBDT College</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #17365d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd3dc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #9bbce5;
            border-color: #17365d;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #17365d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #24518a;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background: #ffeded;
            color: #a32020;
            font-size: 14px;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }

        a {
            color: #17365d;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h2>UBDT College</h2>
        <p class="subtitle">Student Portal Login</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('student_login') }}">
            <label for="student_id">Student ID</label>

            <input
                type="number"
                id="student_id"
                name="student_id"
                min="1"
                required
                placeholder="Enter your Student ID"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="Enter your password"
            >

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <a href="{{ url_for('login') }}">
                Administrator Login
            </a>
        </div>
    </main>
</body>
</html>
